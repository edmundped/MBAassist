<svg xmlns="http://www.w3.org/2000/svg" class="dx dx-spot" viewBox="0 0 360 200" width="100%" role="img" aria-labelledby="dxs-t dxs-d">
<title id="dxs-t">Trade along the West African coast</title>
<desc id="dxs-d">An abstract strip of the Gulf of Guinea coastline on ruled ledger paper. A dashed shipping route links five ports from west to east, a stack of four containers sits by a port, a low harmattan sun hangs in the haze, and a faint downward-sloping demand curve crosses the land.</desc>
<style>
.dx-spot-sea{fill:var(--dx-indigo-soft,#DCE3F2)}
.dx-spot-land{fill:var(--dx-land,#EADFC9)}
.dx-spot-coast{fill:none;stroke:var(--dx-axis,#4E463B);stroke-width:1.25}
.dx-spot-sun{fill:var(--dx-atc,#8A6116);fill-opacity:.85}
.dx-spot-haze{fill:none;stroke:var(--dx-atc,#8A6116);stroke-opacity:.35;stroke-width:1}
.dx-spot-route{fill:none;stroke:var(--dx-mc,#A8452A);stroke-width:2;stroke-dasharray:5 6;stroke-linecap:round}
.dx-spot-port{fill:var(--dx-point,#FFFCF6);stroke:var(--dx-ink,#1B1712);stroke-width:1.75}
.dx-spot-c1{fill:var(--accent,#8A2E3B)}.dx-spot-c2{fill:var(--dx-demand,#2E4C8F)}.dx-spot-c3{fill:var(--dx-atc,#8A6116)}.dx-spot-c4{fill:var(--dx-supply,#1C6B63)}
.dx-spot-rib{stroke:var(--dx-point,#FFFCF6);stroke-opacity:.45;stroke-width:1}
.dx-spot-ledger{stroke:var(--dx-axis,#4E463B);stroke-opacity:.08;stroke-width:1}
.dx-spot-curve{fill:none;stroke:var(--dx-demand,#2E4C8F);stroke-width:2;stroke-linecap:round;opacity:.55}
.dx-spot-route{animation:dx-route 2.8s linear infinite}
@keyframes dx-route{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion:reduce){.dx-spot-route{animation:none}}
</style>
