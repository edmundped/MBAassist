<svg xmlns="http://www.w3.org/2000/svg" class="dx" viewBox="0 0 360 456" width="100%" role="img" aria-labelledby="dxc-t dxc-d" preserveAspectRatio="xMidYMid meet">
<title id="dxc-t">Profit-maximising price and output for a firm with market power</title>
<desc id="dxc-d">Demand is P = 60 − Q, so marginal revenue is 60 − 2Q, twice as steep, and reaches zero at Q = 30. Marginal cost is 12 + Q. MR equals MC at Q* = 16, where both are 28. The price is read up from Q* to the demand curve: P* = 44. Average total cost at Q* is 32.5, so profit is the shaded rectangle (44 − 32.5) × 16 = GH₵184. ATC, 200 ÷ Q + 12 + 0.5Q, reaches its minimum at Q = 20, where MC crosses it. Price exceeds marginal cost by 16, the markup that market power allows.</desc>
<style>
