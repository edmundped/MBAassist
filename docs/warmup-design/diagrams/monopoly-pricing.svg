<path class="dx-leader" d="M157.6,161.9 L166.8,154.0"/>
<text class="dx-note" x="168.8" y="149.7" text-anchor="start"><tspan class="dx-note-b">2</tspan> read P* off D</text>
<text class="dx-note dx-note-b" x="70.4" y="193.9" text-anchor="middle">Profit</text>
<text class="dx-lab dx-lab-d" x="316.0" y="273.1" text-anchor="start">D</text>
<text class="dx-lab dx-lab-mr" x="252.0" y="348.0" text-anchor="start">MR</text>
<text class="dx-lab dx-lab-mc" x="316.0" y="134.1" text-anchor="start">MC</text>
<text class="dx-lab dx-lab-atc" x="316.0" y="199.3" text-anchor="start">ATC</text>
<text class="dx-note" x="16.0" y="412.0" text-anchor="start"><tspan class="dx-note-b">Profit</tspan> = (P* − ATC) × Q* = (44 − 32.5) × 16 = GH₵184</text>
<text class="dx-note" x="16.0" y="428.0" text-anchor="start"><tspan class="dx-note-b">Markup:</tspan> P* 44 sits above MC 28. That gap is market</text>
<text class="dx-note" x="16.0" y="444.0" text-anchor="start">power; under perfect competition, P = MC.</text>
