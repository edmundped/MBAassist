<svg xmlns="http://www.w3.org/2000/svg" class="dx" viewBox="0 0 360 456" width="100%" role="img" aria-labelledby="dxb-t dxb-d" preserveAspectRatio="xMidYMid meet">
<title id="dxb-t">Short-run cost curves: marginal cost crosses average variable cost and average total cost at their minimums</title>
<desc id="dxb-d">Fixed cost is 60 and average variable cost is 30 − 6Q + 0.5Q². Marginal cost, 30 − 12Q + 1.5Q², is U-shaped with its lowest point at Q = 4, where diminishing returns set in. It crosses AVC at AVC's minimum (Q = 6, cost 12) and ATC at ATC's minimum (Q ≈ 7.2, cost ≈ 21). Average fixed cost, 60 ÷ Q, falls continuously, and the vertical gap between ATC and AVC equals AFC, so the two average curves converge as output rises.</desc>
